<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Mar Latrice Styles</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F0E8">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('ml-motion')==='off')document.documentElement.classList.add('rm')}catch(e){}</script>
<style>

*{box-sizing:border-box;margin:0}
html{background:#F6F0E8;color:#141210}
body{min-height:100svh;display:grid;place-items:center;padding:32px 20px;font:400 17px/1.55 'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(640px,100%)}
.k{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#2E2925;margin-bottom:18px;font-weight:600}
h1{font-family:'Noto Serif Display',Georgia,serif;font-weight:400;font-size:clamp(40px,10vw,84px);line-height:.98;letter-spacing:-.01em;text-wrap:balance}
p{margin-top:20px;max-width:34em;opacity:.78;text-wrap:pretty}
a{display:inline-flex;align-items:center;gap:10px;margin-top:32px;min-height:48px;padding:0 24px;border-radius:999px;background:#141210;color:#F6F0E8;font-weight:600;text-decoration:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a:hover{transform:translateY(-2px)}
a:focus-visible{outline:2px solid #2E2925;outline-offset:3px}
a span{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a:hover span{transform:translateX(-4px)}
.r{opacity:0;transform:translateY(22px);animation:up .8s cubic-bezier(.16,1,.3,1) forwards}
.r:nth-child(2){animation-delay:.08s}.r:nth-child(3){animation-delay:.16s}.r:nth-child(4){animation-delay:.24s}
@keyframes up{to{opacity:1;transform:none}}
.rm .r{opacity:1;transform:none;animation:none}
</style>
</head>
<body>
<main>
<span class="k r">Page not found</span>
<h1 class="r">This page isn’t here.</h1>
<p class="r">The link is old or the address has a typo. Head back to the service menu and book your appointment.</p>
<a class="r" href="/"><span aria-hidden="true">&larr;</span>Back to Mar Latrice Styles</a>
</main>
</body>
</html>
